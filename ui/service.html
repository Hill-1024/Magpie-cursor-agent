<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Bridge Live Config</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cb-shell">
    <section class="cb-card">
      <div class="cb-header">
        <div class="cb-title-group">
          <h1 class="cb-title" id="svc-title">Cursor Bridge 实时模型选择器</h1>
          <p class="cb-subtitle" id="svc-subtitle">
            从已同步的 Magpie 模型目录直接选取各角色模型，点击保存后将热写入 roles.json。
          </p>
        </div>
        <div class="cb-actions-bar">
          <button type="button" class="cb-btn cb-btn-ghost" id="svc-back-btn" hidden>返回</button>
          <button type="button" class="cb-btn" id="svc-refresh-btn">刷新状态</button>
          <button type="button" class="cb-btn cb-btn-primary" id="svc-save-btn">保存热更新</button>
        </div>
      </div>

      <div class="cb-status-strip" id="svc-status-strip">
        <span class="cb-pill" id="svc-state-pill">loading...</span>
        <span class="cb-pill" id="svc-auth-pill">models: -</span>
        <span class="cb-pill" id="svc-model-pill">main: -</span>
        <span class="cb-toast" id="svc-toast"></span>
      </div>

      <div class="cb-grid" id="svc-roles-grid"></div>

      <details class="cb-details" open>
        <summary id="svc-subtypes-summary">子代理细分类型映射 (subagentTypes)</summary>
        <div class="cb-subtypes-box">
          <div id="svc-subtypes-list"></div>
          <div class="cb-actions-bar">
            <button type="button" class="cb-btn" id="svc-add-subtype-btn">+ 添加子代理类型映射</button>
          </div>
        </div>
      </details>
    </section>
  </div>
  <script src="shared.js"></script>
  <script src="service.js"></script>
</body>
</html>
