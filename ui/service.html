<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor 角色模型</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="magpie-bridge.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cb-page">
    <header class="cb-page-header">
      <div class="cb-brand">
        <img class="cb-brand-icon" src="icon.svg" width="28" height="28" alt="">
        <div class="cb-brand-text">
          <div class="cb-title-row">
            <h1 class="cb-page-title" id="svc-title">Cursor 角色模型</h1>
            <span class="cb-meta-line" id="svc-meta-line"></span>
          </div>
          <p class="cb-page-subtitle" id="svc-subtitle">
            按职责覆盖默认主模型；更改即自动保存，约 1 秒内热生效。
          </p>
        </div>
      </div>
      <div class="cb-sync-area" aria-live="polite">
        <span class="cb-sync-pill" id="svc-sync-pill" data-kind="idle">
          <span class="cb-dot" aria-hidden="true"></span>
          <span id="svc-sync-text">实时同步中</span>
        </span>
        <button type="button" class="cb-btn-inline" id="svc-retry-btn" hidden>重试</button>
      </div>
    </header>

    <div class="cb-notice" id="svc-notice" hidden>
      <span class="cb-notice-dot" aria-hidden="true"></span>
      <span class="cb-notice-text" id="svc-notice-text"></span>
    </div>

    <section class="cb-section" aria-labelledby="svc-sec-routing-label">
      <div class="cb-section-label" id="svc-sec-routing-label">路由与子代理</div>
      <div class="cb-list" id="svc-routing-list"></div>
    </section>

    <section class="cb-section" aria-labelledby="svc-sec-tasks-label">
      <div class="cb-section-label" id="svc-sec-tasks-label">专项与后台</div>
      <div class="cb-list" id="svc-tasks-list"></div>
    </section>

    <footer class="cb-footer">
      <span class="cb-footer-note" id="svc-footer-note">配置实时写入 roles.json，无需重启 Cursor</span>
      <button type="button" class="cb-btn-ghost-sm" id="svc-reset-all-btn" hidden>恢复全部为默认</button>
    </footer>
  </main>

  <div class="cb-picker" id="svc-picker" role="dialog" aria-modal="false" hidden>
    <div class="cb-picker-head">
      <div class="cb-picker-search-wrap">
        <svg class="cb-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input type="search" class="cb-picker-search" id="svc-picker-search" autocomplete="off" spellcheck="false" placeholder="搜索模型名称、ID 或供应商…">
        <button type="button" class="cb-picker-clear-q" id="svc-picker-clear-q" aria-label="清除搜索" hidden>×</button>
      </div>
      <div class="cb-picker-providers" id="svc-picker-providers" role="tablist"></div>
    </div>
    <div class="cb-picker-list" id="svc-picker-list" role="listbox"></div>
    <div class="cb-picker-foot" id="svc-picker-foot">
      <input type="text" class="cb-picker-custom-input" id="svc-picker-custom-input" autocomplete="off" spellcheck="false" placeholder="或输入自定义模型 ID 后按 Enter">
      <button type="button" class="cb-btn-inline" id="svc-picker-custom-apply">使用</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="service.js"></script>
</body>
</html>
