<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor · Magpie Bridge</title>
  <script src="_magpie/bridge.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel-mode">
  <div class="cb-shell">
    <section class="cb-card">
      <div class="cb-header">
        <div class="cb-title-group">
          <h2 class="cb-title" id="panel-title">Cursor · Magpie Bridge</h2>
          <p class="cb-subtitle" id="panel-subtitle">
            在主模型之外，为 Auto 路由控制、子代理、Bugbot、SecurityBot、标题、摘要、记忆与提交分别指定模型。
          </p>
          <div class="cb-status-strip">
            <span class="cb-pill" id="panel-state-pill">bridge: -</span>
            <span class="cb-pill" id="panel-model-pill">main: -</span>
            <span class="cb-pill" id="panel-count-pill">models: -</span>
            <span class="cb-hint" id="panel-detail"></span>
          </div>
        </div>
        <div class="cb-actions-bar">
          <span class="cb-toast" id="panel-toast" role="status"></span>
          <button type="button" class="cb-btn" id="panel-refresh-btn">刷新模型目录</button>
          <button type="button" class="cb-btn cb-btn-primary" id="panel-save-btn">保存配置</button>
        </div>
      </div>

      <p class="cb-route-note" id="panel-route-note">
        Auto 控制模型留空时默认走 <span class="cb-code">cursor/auto</span>（目录只有
        <span class="cb-code">cursor/auto-smart</span> 时用它）。这条控制链路只用于 Cursor 原生
        Auto，反代出来的 <span class="cb-code">cursor/*</span> 模型照常由 Cursor 自己路由，不会回到本插件。
      </p>

      <div class="cb-grid" id="panel-roles-grid"></div>

      <details class="cb-details" id="panel-subtypes-details">
        <summary id="panel-subtypes-summary">子代理细分类型覆盖 (explore / shell / generalPurpose / browser-use)</summary>
        <div class="cb-subtypes-box">
          <div id="panel-subtypes-list"></div>
          <div class="cb-actions-bar">
            <button type="button" class="cb-btn" id="panel-add-subtype-btn">+ 添加子代理类型</button>
          </div>
        </div>
      </details>
    </section>
  </div>
  <script src="catalog.js"></script>
  <script src="catalog.runtime.js"></script>
  <script src="shared.js"></script>
  <script src="panel.js"></script>
</body>
</html>
